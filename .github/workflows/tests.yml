name: Tests

on:
  push:
  pull_request:

jobs:
  compatibility:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        python: ["3.10", "3.11", "3.12", "3.13", "3.14"]
        include:
          - {os: windows-latest, python: "3.14"}
    env:
      OMP_NUM_THREADS: "1"
      OPENBLAS_NUM_THREADS: "1"
      MKL_NUM_THREADS: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install CPU PyTorch
        run: python -m pip install "torch>=2.7.1,<3" --index-url https://download.pytorch.org/whl/cpu
      - name: Install tidyHEBO and test dependencies
        run: python -m pip install ".[test]"
      - run: python -m pip check
      - run: python -m pytest -q
