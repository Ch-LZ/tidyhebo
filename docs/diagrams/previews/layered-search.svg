<text x="80" y="373" font-family="DejaVu Sans,sans-serif" font-size="19" font-weight="bold" fill="#24364a">point_pre_init · q = 1</text>
<text x="80" y="400" font-family="DejaVu Sans,sans-serif" font-size="16" fill="#334155">AnalyticMACE / QuadratureMACE</text>
<text x="80" y="422" font-family="DejaVu Sans,sans-serif" font-size="16" fill="#334155">Своя Sobol-нормировка · якоря + 6 лучей</text>
<text x="80" y="444" font-family="DejaVu Sans,sans-serif" font-size="16" fill="#334155">3 restart × 30 Adam · Sobol до 48 точек</text>
