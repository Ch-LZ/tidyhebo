<text x="740" y="373" font-family="DejaVu Sans,sans-serif" font-size="19" font-weight="bold" fill="#24364a">Совместная AF · q &gt; 1</text>
<text x="740" y="400" font-family="DejaVu Sans,sans-serif" font-size="16" fill="#334155">QMC MACE: qLogEI / qPI / qUCB</text>
<text x="740" y="422" font-family="DejaVu Sans,sans-serif" font-size="16" fill="#334155">512 семплов · исходный масштаб</text>
<text x="740" y="444" font-family="DejaVu Sans,sans-serif" font-size="16" fill="#334155">При q = 1 — точечная AF</text>
<rect x="720" y="515" width="500" height="90" rx="10" fill="#dfefe4" stroke="#52677c"/>
<text x="740" y="543" font-family="DejaVu Sans,sans-serif" font-size="19" font-weight="bold" fill="#24364a">Нормировка батчевого уровня</text>
<text x="740" y="570" font-family="DejaVu Sans,sans-serif" font-size="16" fill="#334155">Своя Sobol-калибровка для (q,d)</text>
<text x="740" y="592" font-family="DejaVu Sans,sans-serif" font-size="16" fill="#334155">Замороженный augmented Chebyshev</text>
<rect x="720" y="675" width="500" height="110" rx="10" fill="#dfefe4" stroke="#52677c"/>
<text x="740" y="703" font-family="DejaVu Sans,sans-serif" font-size="19" font-weight="bold" fill="#24364a">_initialize · полные батчи</text>
<text x="740" y="730" font-family="DejaVu Sans,sans-serif" font-size="16" fill="#334155">Якоря + 6 лучей · 3 restart × 30 Adam</text>
<text x="740" y="752" font-family="DejaVu Sans,sans-serif" font-size="16" fill="#334155">Добавить батчи малого GA</text>
<text x="740" y="774" font-family="DejaVu Sans,sans-serif" font-size="16" fill="#334155">Sobol до 48 индивидов</text>
<rect x="720" y="855" width="500" height="110" rx="10" fill="#dfefe4" stroke="#52677c"/>
<text x="740" y="883" font-family="DejaVu Sans,sans-serif" font-size="19" font-weight="bold" fill="#24364a">batches_ga · NSGA-III</text>
<text x="740" y="910" font-family="DejaVu Sans,sans-serif" font-size="16" fill="#334155">48 индивидов / 48 потомков × 20</text>
<text x="740" y="932" font-family="DejaVu Sans,sans-serif" font-size="16" fill="#334155">Hungarian kernel matching → crossover</text>
<text x="740" y="954" font-family="DejaVu Sans,sans-serif" font-size="16" fill="#334155">Три исходных AF, без скаляризации</text>
<rect x="720" y="1035" width="500" height="110" rx="10" fill="#fff2d1" stroke="#52677c"/>
<text x="740" y="1063" font-family="DejaVu Sans,sans-serif" font-size="19" font-weight="bold" fill="#24364a">Финальное локальное уточнение</text>
<text x="740" y="1090" font-family="DejaVu Sans,sans-serif" font-size="16" fill="#334155">До ceil(0.2 × N) направленных победителей</text>
<text x="740" y="1112" font-family="DejaVu Sans,sans-serif" font-size="16" fill="#334155">15 Adam → merge → NSGA-III survival</text>
<text x="740" y="1134" font-family="DejaVu Sans,sans-serif" font-size="16" fill="#334155">Сохранять лучшие допустимые restart</text>
<rect x="720" y="1215" width="500" height="90" rx="10" fill="#ffe2bd" stroke="#52677c"/>
<text x="740" y="1243" font-family="DejaVu Sans,sans-serif" font-size="19" font-weight="bold" fill="#24364a">Фронт → suggest</text>
<text x="740" y="1270" font-family="DejaVu Sans,sans-serif" font-size="16" fill="#334155">Один равномерно выбранный q-батч</text>
<text x="740" y="1292" font-family="DejaVu Sans,sans-serif" font-size="16" fill="#334155">или весь фронт при return_all=True</text>
<rect x="60" y="900" width="500" height="120" rx="10" fill="#fff2d1" stroke="#52677c"/>
<text x="80" y="928" font-family="DejaVu Sans,sans-serif" font-size="19" font-weight="bold" fill="#24364a">scalarization.py + local.py</text>
<text x="80" y="955" font-family="DejaVu Sans,sans-serif" font-size="16" fill="#334155">Chebyshev нужен локальному Adam.</text>
<text x="80" y="977" font-family="DejaVu Sans,sans-serif" font-size="16" fill="#334155">Якоря оптимизируют один критерий.</text>
<text x="80" y="999" font-family="DejaVu Sans,sans-serif" font-size="16" fill="#334155">Каждая строка Adam — отдельный restart.</text>
