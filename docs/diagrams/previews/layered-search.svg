<text x="80" y="703" font-family="DejaVu Sans,sans-serif" font-size="19" font-weight="bold" fill="#24364a">small_batches_ga</text>
<text x="80" y="730" font-family="DejaVu Sans,sans-serif" font-size="16" fill="#334155">Индивид = q индексов пула</text>
<text x="80" y="752" font-family="DejaVu Sans,sans-serif" font-size="16" fill="#334155">Совместная AF полного батча</text>
<text x="80" y="774" font-family="DejaVu Sans,sans-serif" font-size="16" fill="#334155">NSGA-III: 48 × 5 поколений</text>
