<text x="80" y="1138" font-family="DejaVu Sans,sans-serif" font-size="19" font-weight="bold" fill="#24364a">Допустимость и представление</text>
<text x="80" y="1165" font-family="DejaVu Sans,sans-serif" font-size="16" fill="#334155">Координаты в [0,1]; точки не наблюдались;</text>
<text x="80" y="1187" font-family="DejaVu Sans,sans-serif" font-size="16" fill="#334155">нет повторов внутри батча.</text>
<text x="80" y="1209" font-family="DejaVu Sans,sans-serif" font-size="16" fill="#334155">AF: GP-координаты; выход: GA-координаты.</text>
<text x="80" y="1231" font-family="DejaVu Sans,sans-serif" font-size="16" fill="#334155">Порядок точек канонизируется.</text>
