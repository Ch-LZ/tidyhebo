[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "tidyhebo"
version = "0.1.0"
description = "Bayesian optimization with model-consistent warping and qMACE"
readme = {"file" = "README.md", "content-type" = "text/markdown"}
license = "CC-BY-NC-4.0"
license-files = ["LICENSE.md"]
requires-python = ">=3.10"
authors = [
    { name = "Lev Zhukov" },
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Programming Language :: Python",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Python :: Implementation :: CPython",
    "Operating System :: OS Independent",
]
# Keep BoTorch within the tested release series: qMACE uses its internal reductions.
dependencies = [
    "torch>=2.7.1,<3",
    "botorch>=0.14,<0.19",
    "gpytorch>=1.14,<2",
    "pymoo>=0.6.1.5,<0.7",
    "numpy>=1.26.4,<3",
    "pandas>=2.2.3,<4",
    "scipy>=1.13.1,<2",
]

[project.urls]
Source = "https://github.com/Ch-LZ/tidyhebo"

[project.optional-dependencies]
test = ["pytest>=8.3"]
dev = ["tidyhebo[test]", "matplotlib"]

[tool.pytest.ini_options]
filterwarnings = [
    "ignore:__array__ implementation doesn't accept a copy keyword:DeprecationWarning",
    "ignore:ExpectedImprovement has known numerical issues:botorch.exceptions.warnings.NumericsWarning:botorch.acquisition.analytic",
]

[tool.hatch.envs.dev]
features = ["dev"]

[tool.hatch.build.targets.sdist]
include = [
    "/tidyhebo",
    "/tests",
    "/docs",
    "/LICENSE.md",
    "/examples",
]
